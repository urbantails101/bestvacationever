<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Vacation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #07182f;
  --navy-light: #0d2342;
  --gold: #d4af37;
  --gold-light: #e6ca68;
  --white: #ffffff;
  --muted: #b9c3d1;
  --border: rgba(212,175,55,.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--navy);
  color: var(--white);
  overflow-x: hidden;
}

h1, h2, h3, .logo, .destination-name {
  font-family: "Playfair Display", Georgia, serif;
}

/* HERO */

.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background:
    linear-gradient(rgba(7,24,47,.48), rgba(7,24,47,.78)),
    url("https://images.unsplash.com/photo-1522083165195-3424ed129620?auto=format&fit=crop&w=2400&q=85")
    center/cover no-repeat;
}

.hero-content {
  max-width: 900px;
  padding: 40px 24px;
  animation: fadeUp 1s ease;
}

.logo {
  font-size: 27px;
  letter-spacing: .5px;
  margin-bottom: 75px;
}

.logo span {
  display: block;
  color: var(--gold);
  font-family: Arial, sans-serif;
  font-size: 13px;
  margin-top: 4px;
}

.hero h1 {
  font-size: clamp(48px, 8vw, 86px);
  line-height: 1.02;
  font-weight: 600;
  margin-bottom: 25px;
}

.hero p {
  font-size: 20px;
  color: #edf1f7;
  margin-bottom: 42px;
}

.cta {
  border: none;
  background: var(--gold);
  color: var(--navy);
  padding: 17px 31px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: .25s ease;
}

.cta:hover {
  transform: translateY(-4px);
  background: var(--gold-light);
}

/* QUIZ */

.quiz-section {
  min-height: 100vh;
  padding: 100px 24px;
  background: var(--navy);
}

.quiz-container {
  max-width: 900px;
  margin: auto;
}

.progress-area {
  margin-bottom: 55px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 12px;
}

.progress-bar {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,.12);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: width .45s ease;
}

.question-number {
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 13px;
  margin-bottom: 17px;
}

.question {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(32px, 5vw, 55px);
  line-height: 1.12;
  margin-bottom: 42px;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 17px;
}

.answer {
  background: var(--navy-light);
  border: 1px solid var(--border);
  padding: 25px;
  min-height: 85px;
  text-align: left;
  color: white;
  cursor: pointer;
  transition: .25s ease;
  font-size: 16px;
  border-radius: 4px;
}

.answer:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
}

.answer.selected {
  background: var(--gold);
  color: var(--navy);
  border-color: var(--gold);
  font-weight: 700;
}

.navigation {
  display: flex;
  justify-content: space-between;
  margin-top: 35px;
  gap: 15px;
}

.nav-btn {
  border: none;
  background: var(--gold);
  color: var(--navy);
  padding: 14px 27px;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s ease;
}

.nav-btn:hover:not(:disabled) {
  transform: translateY(-3px);
}

.nav-btn:disabled {
  opacity: .3;
  cursor: not-allowed;
}

/* RESULTS */

.results {
  display: none;
  min-height: 100vh;
  padding: 90px 24px;
  background: var(--navy);
}

.results-container {
  max-width: 1100px;
  margin: auto;
}

.result-intro {
  text-align: center;
  margin-bottom: 45px;
}

.result-intro p {
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 13px;
  margin-bottom: 14px;
}

.result-intro h2 {
  font-size: clamp(40px, 6vw, 65px);
}

.winner {
  position: relative;
  height: 560px;
  overflow: hidden;
  margin-bottom: 60px;
}

.winner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.winner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    transparent 20%,
    rgba(7,24,47,.2) 45%,
    rgba(7,24,47,.92) 100%
  );
}

.winner-info {
  position: absolute;
  z-index: 2;
  bottom: 45px;
  left: 45px;
  right: 45px;
  text-align: center;
}

.destination-name {
  font-size: clamp(50px, 8vw, 90px);
  margin-bottom: 13px;
}

.winner-description {
  max-width: 650px;
  margin: auto;
  font-size: 17px;
  line-height: 1.6;
}

.runners-title {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 32px;
  margin-bottom: 25px;
}

.runner-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.runner {
  background: var(--navy-light);
}

.runner img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
}

.runner h3 {
  padding: 20px;
  font-size: 25px;
}

.restart {
  display: block;
  margin: 50px auto 0;
}

/* ANIMATION */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade {
  animation: fadeUp .45s ease;
}

/* MOBILE */

@media (max-width: 700px) {

  .answers {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 50px;
  }

  .winner {
    height: 470px;
  }

  .winner-info {
    left: 20px;
    right: 20px;
    bottom: 30px;
  }

  .runner-grid {
    grid-template-columns: 1fr;
  }

  .navigation {
    flex-direction: column-reverse;
  }

  .nav-btn {
    width: 100%;
  }
}
</style>
</head>

<!-- HERO -->

    </div>

    <h2 id="question" class="question"></h2>

    <div class="navigation">

        class="nav-btn"

        ← Back
      </button>

      <button
        id="nextBtn"
        class="nav-btn"
        onclick="nextQuestion()"

        Next →
      </button>

    </div>

  </div>

</section>


<!-- RESULTS -->

<section class="results" id="results">

  <div class="results-container">

    </div>

    <h3 class="runners-title">You might also love...</h3>

    <div id="runnerGrid" class="runner-grid"></div>

    <button class="cta restart" onclick="restartQuiz()">
      Take the Quiz Again

    text: "Finally, what do you want to say when you get home?",
    answers: [
      {text:"That was the most exciting trip ever.", tags:["adventure","city"]},
      {text:"I can't believe how beautiful that was.", tags:["nature","beach"]},
      {text:"I learned SO much.", tags:["culture","history"]},
      {text:"I wish I could stay forever.", tags:["relaxed","luxury"]}
    ]
  }

];


/* =========================================
   QUIZ ENGINE
========================================= */

let currentQuestion = 0;
let selectedAnswer = null;
let userAnswers = [];


function startQuiz() {

  document.getElementById("quiz").scrollIntoView({
    behavior: "smooth"
  });

  setTimeout(() => {
    renderQuestion();
  }, 400);

}


function renderQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    `Question ${currentQuestion + 1}`;

  document.getElementById("progressText").textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;

  const percent = Math.round(
    ((currentQuestion + 1) / questions.length) * 100
  );

  document.getElementById("progressPercent").textContent =
    `${percent}%`;

  document.getElementById("progressFill").style.width =
    `${percent}%`;

  document.getElementById("question").textContent =
    q.text;

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  selectedAnswer = userAnswers[currentQuestion] ?? null;

  q.answers.forEach((answer, index) => {

    const button = document.createElement("button");

    button.className = "answer";

    button.textContent = answer.text;

    if (selectedAnswer === index) {
      button.classList.add("selected");
    }

    button.onclick = () => selectAnswer(index);

    answers.appendChild(button);

  });

  document.getElementById("backBtn").disabled =
    currentQuestion === 0;

  document.getElementById("nextBtn").disabled =
    selectedAnswer === null;

  document.getElementById("nextBtn").textContent =
    currentQuestion === questions.length - 1
      ? "See My Results →"
      : "Next →";

  document.querySelector(".quiz-container").classList.remove("fade");

  void document.querySelector(".quiz-container").offsetWidth;

  document.querySelector(".quiz-container").classList.add("fade");
}


function selectAnswer(index) {

  selectedAnswer = index;

  userAnswers[currentQuestion] = index;

  document.querySelectorAll(".answer").forEach((button, i) => {

    button.classList.toggle(
      "selected",
      i === index
    );

  });

  document.getElementById("nextBtn").disabled = false;
}


function nextQuestion() {

  if (selectedAnswer === null) return;

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    renderQuestion();

    window.scrollTo({
      top: document.getElementById("quiz").offsetTop,
      behavior: "smooth"
    });

  } else {

    showResults();

  }

}


function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    renderQuestion();

  }

}


/* =========================================
   SCORING
========================================= */

function calculateScores() {

  const scores = {};

  destinations.forEach(destination => {

    scores[destination.name] = 0;

  });


  userAnswers.forEach((answerIndex, questionIndex) => {

    if (answerIndex === undefined) return;

    const answer =
      questions[questionIndex].answers[answerIndex];

    if (!answer) return;


    destinations.forEach(destination => {

      let points = 0;

      answer.tags.forEach(tag => {

        if (destination.tags.includes(tag)) {

          points += 3;

        }

      });


      /*
        Small bonus for destinations matching
        multiple parts of an answer.
      */

      const matchingTags =
        answer.tags.filter(tag =>
          destination.tags.includes(tag)
        ).length;

      if (matchingTags >= 2) {
        points += 1;
      }


      scores[destination.name] += points;

    });

  });


  /*
    Add tiny random tie-breaker only.
    This DOES NOT determine the winner.
  */

  destinations.forEach(destination => {

    scores[destination.name] +=
      Math.random() * 0.01;

  });


  return scores;
}


/* =========================================
   RESULTS
========================================= */

function showResults() {

  const scores = calculateScores();

  const ranked = [...destinations].sort(
    (a, b) =>
      scores[b.name] - scores[a.name]
  );


  const winner = ranked[0];

  const runnersUp = ranked.slice(1, 4);


  document.getElementById("winnerImage").src =
    winner.image;

  document.getElementById("winnerImage").alt =
    winner.name;

  document.getElementById("winnerName").textContent =
    winner.name;

  document.getElementById("winnerDescription").textContent =
    winner.description;


  const runnerGrid =
    document.getElementById("runnerGrid");

  runnerGrid.innerHTML = "";


  runnersUp.forEach(destination => {

    const card = document.createElement("div");

    card.className = "runner";

    card.innerHTML = `
      <img
        src="${destination.image}"
        alt="${destination.name}"
      >
      <h3>${destination.name}</h3>
    `;

    runnerGrid.appendChild(card);

  });


  document.getElementById("quiz").style.display =
    "none";

  document.getElementById("results").style.display =
    "block";

  window.scrollTo({
    top: document.getElementById("results").offsetTop,
    behavior: "smooth"
  });

}


/* =========================================
   RESTART
========================================= */

function restartQuiz() {

  currentQuestion = 0;
  selectedAnswer = null;
  userAnswers = [];

  document.getElementById("results").style.display =
    "none";

  document.getElementById("quiz").style.display =
    "block";

  renderQuestion();

  window.scrollTo({
    top: document.getElementById("quiz").offsetTop,
    behavior: "smooth"
  });

}

</script>
